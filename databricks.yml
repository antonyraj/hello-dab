# This is a Databricks asset bundle definition for hello_dab.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: hello_dab
  uuid: dd741c7e-03cd-43cf-85ff-5141a1aa6f28

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7488500312027058.18.azuredatabricks.net
      profile: DEFAULT
    variables:
      catalog: learning_lab_catalog
      schema: dasset_bundle_dev
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://adb-7488500312027058.18.azuredatabricks.net
      profile: DEFAULT
      # We explicitly deploy to /Workspace/Users/antony@diggibyte.com to make sure we only have a single copy.
      root_path: /Workspace/Users/antony@diggibyte.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: learning_lab_catalog
      schema: asset_bundle_stage
    permissions:
      - user_name: antony@diggibyte.com
        level: CAN_MANAGE
        
resources:
  jobs:
    sql_server_ingestion:
      name: sql-server-ingestion-job

      tasks:
        - task_key: ingest_orders
          spark_python_task:
            python_file: src/ingest_sql_server.py
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1

